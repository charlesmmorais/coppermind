  <line x1="500" y1="710" x2="540" y2="710" stroke="#7d8da5" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="745" y1="758" x2="745" y2="790" stroke="#7d8da5" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="295" y1="758" x2="295" y2="790" stroke="#7d8da5" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="145" y="792" width="750" height="70" rx="11" fill="#13233a" stroke="#d4a017" stroke-width="1.6"/>
  <text x="520" y="817" fill="#f2dca0" font-size="14" font-weight="700" text-anchor="middle">Transações e gates</text>
  <text x="520" y="839" fill="#9fb0c8" font-size="12" text-anchor="middle">preview · commit · rollback · undo/redo · Circuit IR invariável · DRC/ERC · paths validados</text>
  <text x="520" y="856" fill="#9fb0c8" font-size="10.8" text-anchor="middle">integrações: fornecedores · datasheets · Freerouting · variantes</text>

  <text x="520" y="886" fill="#72839b" font-size="10.5" text-anchor="middle">Streamable HTTP é loopback-only e single-user por processo.</text>
</svg>