  <text x="520" y="418" fill="#c4d3e6" font-size="12.5" text-anchor="middle">Component · Pin · Net · Constraint · símbolos reais do KiCad</text>
  <line x1="520" y1="434" x2="520" y2="462" stroke="#7d8da5" stroke-width="2" marker-end="url(#arr)"/>

