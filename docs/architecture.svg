      <stop offset="0" stop-color="#0f1b2d"/><stop offset="1" stop-color="#0b1422"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7d8da5"/>
    </marker>
  </defs>
  <rect width="1040" height="900" rx="18" fill="url(#bg)"/>
  <text x="36" y="48" fill="#e6edf3" font-size="27" font-weight="700">Coppermind — Arquitetura atual</text>
  <text x="36" y="73" fill="#9fb0c8" font-size="14">MCP semântico · Circuit IR · KiCad · transacional · verificado · stdio + Streamable HTTP</text>

  <rect x="270" y="96" width="500" height="54" rx="11" fill="#15263d" stroke="#2dd4bf" stroke-width="1.5"/>
