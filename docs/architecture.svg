  <text x="295" y="711" fill="#c4d3e6" font-size="11.5" text-anchor="middle">métricas determinísticas + reflow</text>
  <text x="295" y="730" fill="#c4d3e6" font-size="11.5" text-anchor="middle">reviewer multimodal opcional</text>
  <text x="295" y="749" fill="#9fb0c8" font-size="10.8" text-anchor="middle">PDF/contexto limitado · advisory por padrão</text>

  <rect x="540" y="664" width="410" height="94" rx="11" fill="#10263a" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="745" y="689" fill="#7bf0dd" font-size="14" font-weight="700" text-anchor="middle">Visual Auto-Fix</text>
  <text x="745" y="711" fill="#c4d3e6" font-size="11.5" text-anchor="middle">Layout Action IR · copy-on-write</text>
  <text x="745" y="730" fill="#c4d3e6" font-size="11.5" text-anchor="middle">ERC diff · score gates · rollback</text>
